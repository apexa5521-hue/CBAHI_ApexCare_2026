<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة CBAHI • Apex Care</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>

:root {
  --bg:#0a0e1a; --surface:#111827; --surface2:#1a2235; --surface3:#1e2d45;
  --accent:#00c2ff; --accent2:#0080ff; --gold:#f0b429; --green:#10d97e;
  --red:#ff4757; --orange:#ff7c2a; --purple:#a855f7;
  --border:rgba(0,194,255,0.12); --text:#e2eaf8; --text2:#8fa8cc; --text3:#5a7599;
  --glow:0 0 20px rgba(0,194,255,0.15); --radius:14px; --radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;min-height:100vh}
::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-thumb{background:var(--accent2);border-radius:3px}

/* HEADER */
.header{background:linear-gradient(135deg,#0a1628,#0d1f3c);border-bottom:1px solid var(--border);
  padding:0 24px;position:sticky;top:0;z-index:100;display:flex;align-items:center;
  justify-content:space-between;height:62px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;color:#fff;box-shadow:0 0 15px rgba(0,194,255,0.4)}
.logo-text{font-size:16px;font-weight:800} .logo-sub{font-size:10px;color:var(--accent);letter-spacing:1px}
.header-actions{display:flex;align-items:center;gap:10px}

/* STATUS BAR — محسّن */
.status-bar{background:var(--surface);border-bottom:1px solid var(--border);
  padding:8px 24px;display:flex;align-items:center;justify-content:space-between;font-size:12px;flex-wrap:wrap}
.status-left{display:flex;align-items:center;gap:16px}
.sb-item{display:flex;align-items:center;gap:6px;color:var(--text3)}
.sb-dot{width:7px;height:7px;border-radius:50%;animation:pulse 2s ease-in-out infinite}
.connected{color:var(--green)} 
.disconnected{color:var(--red)} 
.syncing{color:var(--gold)}

/* زر المزامنة اليدوية */
.sync-btn{
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  color:#fff;border:none;border-radius:6px;padding:6px 14px;
  font-family:'Tajawal',sans-serif;font-size:11px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;gap:5px;transition:.2s
}
.sync-btn:hover{opacity:.85;transform:scale(1.02)}
.sync-btn:disabled{opacity:.4;cursor:not-allowed}
.sync-btn.syncing{animation:rotating 1s linear infinite}

@keyframes pulse{0%,100%{opacity:1} 50%{opacity:.4}}
@keyframes rotating{from{transform:rotate(0deg)} to{transform:rotate(360deg)}}

/* TABS */
.tabs{display:flex;gap:6px;padding:16px 24px 0;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  color:var(--text2);font-family:'Tajawal',sans-serif;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .2s;white-space:nowrap}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;
  border-color:transparent;box-shadow:0 0 12px rgba(0,194,255,0.3)}

.main{padding:20px 24px;max-width:1440px;margin:0 auto}
.pane{display:none} .pane.active{display:block}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.kpi-grid{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;position:relative;overflow:hidden;transition:.2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--glow)}
.kpi-lbl{font-size:11px;color:var(--text3);font-weight:600;margin-bottom:6px;letter-spacing:.5px}
.kpi-val{font-size:30px;font-weight:900;line-height:1;margin-bottom:4px;font-family:'Cairo',sans-serif}
.kpi.blue .kpi-val{color:var(--accent)} .kpi.gold .kpi-val{color:var(--gold)}
.kpi.green .kpi-val{color:var(--green)} .kpi.red .kpi-val{color:var(--red)}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:4px}
.pbar{height:6px;background:rgba(255,255,255,0.06);border-radius:3px;margin-top:10px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width 1s ease}
.pfill.blue{background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 6px rgba(0,194,255,.5)}
.pfill.green{background:linear-gradient(90deg,#059669,var(--green));box-shadow:0 0 6px rgba(16,217,126,.5)}
.pfill.gold{background:linear-gradient(90deg,#d97706,var(--gold));box-shadow:0 0 6px rgba(240,180,41,.5)}

/* TOAST */
.toast-wrap{position:fixed;bottom:20px;left:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;
  color:#fff;animation:slideIn .3s ease;max-width:300px;
  display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.toast.success{background:rgba(16,217,126,.15);border:1px solid var(--green);color:var(--green)}
.toast.error{background:rgba(255,71,87,.15);border:1px solid var(--red);color:var(--red)}
.toast.info{background:rgba(0,194,255,.15);border:1px solid var(--accent);color:var(--accent)}
@keyframes slideIn{from{transform:translateX(-100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Loading Overlay */
.loading-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9998;
  align-items:center;justify-content:center;backdrop-filter:blur(6px);
}
.loading-overlay.show{display:flex}
.loading-content{text-align:center}
.spinner{width:50px;height:50px;border:4px solid rgba(0,194,255,.2);
  border-top:4px solid var(--accent);border-radius:50%;
  animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--accent);font-size:14px;font-weight:600}

</style>
</head>
<body>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-content">
    <div class="spinner"></div>
    <div class="loading-text">🔄 جارٍ المزامنة مع Google Sheets...</div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- Header -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">A</div>
    <div>
      <div class="logo-text">لوحة اعتماد CBAHI</div>
      <div class="logo-sub">APEX CARE CLINICS</div>
    </div>
  </div>
  <div class="header-actions">
    <span id="lastSync" style="font-size:11px;color:var(--text3)"></span>
  </div>
</div>

<!-- Status Bar -->
<div class="status-bar">
  <div class="status-left">
    <div class="sb-item">
      <div class="sb-dot" id="connectionDot"></div>
      <span id="connectionStatus">جارٍ الاتصال...</span>
    </div>
    <div class="sb-item">
      📊 <span id="dataCount">--</span> سجل
    </div>
    <div class="sb-item">
      🕒 آخر تحديث: <span id="lastUpdate">--</span>
    </div>
  </div>
  <div>
    <button class="sync-btn" id="syncBtn" onclick="manualSync()">
      <span id="syncIcon">🔄</span>
      <span id="syncText">مزامنة</span>
    </button>
  </div>
</div>

<!-- Main Content -->
<div class="main">
  <div class="kpi-grid">
    <div class="kpi blue">
      <div class="kpi-lbl">الملاحظات</div>
      <div class="kpi-val" id="kpi-observations">--</div>
    </div>
    <div class="kpi gold">
      <div class="kpi-lbl">المتطلبات</div>
      <div class="kpi-val" id="kpi-requirements">--</div>
    </div>
    <div class="kpi green">
      <div class="kpi-lbl">الفريق</div>
      <div class="kpi-val" id="kpi-team">--</div>
    </div>
    <div class="kpi red">
      <div class="kpi-lbl">السياسات</div>
      <div class="kpi-val" id="kpi-policies">--</div>
    </div>
  </div>

  <div id="dataDisplay" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px">
    <h3 style="margin-bottom:16px">📊 البيانات المحمّلة</h3>
    <pre id="rawData" style="background:var(--bg);padding:16px;border-radius:8px;overflow-x:auto;font-size:11px;color:var(--text2)">
جارٍ التحميل...
    </pre>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIGURATION — ضع رابط Apps Script هنا
// ═══════════════════════════════════════════════════════════
const GAS_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let DB = {
  observations: [],
  requirements: [],
  team: [],
  locations: [],
  tmpChanges: [],
  lectures: [],
  assignments: [],
  policies: [],
  workflow: [],
  patientFiles: [],
  dashboard: {},
  timestamp: null
};

let syncInProgress = false;
let autoSyncInterval = null;

// ═══════════════════════════════════════════════════════════
// INITIALIZATION — يتم تشغيله تلقائياً عند فتح الصفحة
// ═══════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  console.log('🚀 تهيئة النظام...');
  
  // عرض شاشة التحميل
  showLoading(true);
  
  // محاولة المزامنة التلقائية
  await initialSync();
  
  // إخفاء شاشة التحميل
  showLoading(false);
  
  // بدء المزامنة التلقائية كل 30 ثانية
  startAutoSync(30000); // 30 seconds
  
  console.log('✅ النظام جاهز');
});

// ═══════════════════════════════════════════════════════════
// SYNC FUNCTIONS
// ═══════════════════════════════════════════════════════════

async function initialSync() {
  console.log('🔄 بدء المزامنة الأولية...');
  updateConnectionStatus('syncing', 'جارٍ المزامنة...');
  
  try {
    const data = await fetchAllData();
    
    if (data && !data.error) {
      DB = data;
      updateUI();
      updateConnectionStatus('connected', 'متصل ✓');
      updateLastSync();
      toast('✅ تم تحميل البيانات بنجاح', 'success');
      console.log('✅ المزامنة الأولية نجحت');
    } else {
      throw new Error(data?.error || 'فشل تحميل البيانات');
    }
  } catch (error) {
    console.error('❌ خطأ في المزامنة:', error);
    updateConnectionStatus('disconnected', 'غير متصل ✗');
    toast('⚠️ فشل الاتصال بـ Google Sheets', 'error');
  }
}

async function manualSync() {
  if (syncInProgress) {
    toast('⏳ المزامنة قيد التنفيذ...', 'info');
    return;
  }
  
  syncInProgress = true;
  const btn = document.getElementById('syncBtn');
  const icon = document.getElementById('syncIcon');
  const text = document.getElementById('syncText');
  
  // تحديث UI الزر
  btn.disabled = true;
  btn.classList.add('syncing');
  icon.textContent = '⏳';
  text.textContent = 'جارٍ المزامنة...';
  
  updateConnectionStatus('syncing', 'جارٍ المزامنة...');
  
  try {
    const data = await fetchAllData();
    
    if (data && !data.error) {
      DB = data;
      updateUI();
      updateConnectionStatus('connected', 'متصل ✓');
      updateLastSync();
      toast('✅ تمت المزامنة بنجاح', 'success');
    } else {
      throw new Error(data?.error || 'فشل تحميل البيانات');
    }
  } catch (error) {
    console.error('❌ خطأ في المزامنة:', error);
    updateConnectionStatus('disconnected', 'غير متصل ✗');
    toast('⚠️ فشل الاتصال', 'error');
  } finally {
    syncInProgress = false;
    btn.disabled = false;
    btn.classList.remove('syncing');
    icon.textContent = '🔄';
    text.textContent = 'مزامنة';
  }
}

function startAutoSync(intervalMs) {
  if (autoSyncInterval) {
    clearInterval(autoSyncInterval);
  }
  
  autoSyncInterval = setInterval(async () => {
    console.log('🔄 مزامنة تلقائية...');
    
    if (!syncInProgress) {
      try {
        const data = await fetchAllData();
        if (data && !data.error) {
          DB = data;
          updateUI();
          updateConnectionStatus('connected', 'متصل ✓');
          updateLastSync();
          console.log('✅ مزامنة تلقائية نجحت');
        }
      } catch (error) {
        console.error('❌ خطأ في المزامنة التلقائية:', error);
        updateConnectionStatus('disconnected', 'غير متصل ✗');
      }
    }
  }, intervalMs);
  
  console.log(`⏰ تم تفعيل المزامنة التلقائية كل ${intervalMs/1000} ثانية`);
}

function stopAutoSync() {
  if (autoSyncInterval) {
    clearInterval(autoSyncInterval);
    autoSyncInterval = null;
    console.log('⏸️ تم إيقاف المزامنة التلقائية');
  }
}

// ═══════════════════════════════════════════════════════════
// API CALLS
// ═══════════════════════════════════════════════════════════

async function fetchAllData() {
  const url = `${GAS_URL}?action=getData&t=${Date.now()}`;
  
  try {
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    const data = await response.json();
    return data;
  } catch (error) {
    console.error('❌ خطأ في fetch:', error);
    throw error;
  }
}

// ═══════════════════════════════════════════════════════════
// UI UPDATES
// ═══════════════════════════════════════════════════════════

function updateUI() {
  // Update KPIs
  document.getElementById('kpi-observations').textContent = DB.observations?.length || 0;
  document.getElementById('kpi-requirements').textContent = DB.requirements?.length || 0;
  document.getElementById('kpi-team').textContent = DB.team?.length || 0;
  document.getElementById('kpi-policies').textContent = DB.policies?.length || 0;
  
  // Update data count
  const total = 
    (DB.observations?.length || 0) +
    (DB.requirements?.length || 0) +
    (DB.team?.length || 0) +
    (DB.policies?.length || 0) +
    (DB.locations?.length || 0) +
    (DB.tmpChanges?.length || 0) +
    (DB.lectures?.length || 0) +
    (DB.assignments?.length || 0) +
    (DB.workflow?.length || 0) +
    (DB.patientFiles?.length || 0);
  
  document.getElementById('dataCount').textContent = total;
  
  // Update timestamp
  if (DB.timestamp) {
    const date = new Date(DB.timestamp);
    document.getElementById('lastUpdate').textContent = date.toLocaleString('ar-SA', {
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit'
    });
  }
  
  // Display raw data (for debugging)
  document.getElementById('rawData').textContent = JSON.stringify(DB, null, 2);
}

function updateConnectionStatus(status, text) {
  const dot = document.getElementById('connectionDot');
  const statusText = document.getElementById('connectionStatus');
  
  dot.className = 'sb-dot ' + status;
  statusText.textContent = text;
}

function updateLastSync() {
  const now = new Date();
  document.getElementById('lastSync').textContent = 
    'آخر مزامنة: ' + now.toLocaleTimeString('ar-SA', {
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit'
    });
}

function showLoading(show) {
  const overlay = document.getElementById('loadingOverlay');
  overlay.className = show ? 'loading-overlay show' : 'loading-overlay';
}

// ═══════════════════════════════════════════════════════════
// TOAST NOTIFICATIONS
// ═══════════════════════════════════════════════════════════

function toast(msg, type = 'info') {
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  wrap.appendChild(t);
  
  setTimeout(() => {
    t.style.opacity = '0';
    setTimeout(() => t.remove(), 300);
  }, 3000);
}

// ═══════════════════════════════════════════════════════════
// CLEANUP
// ═══════════════════════════════════════════════════════════

window.addEventListener('beforeunload', () => {
  stopAutoSync();
});

</script>
</body>
</html>
